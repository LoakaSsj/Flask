<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://js.pusher.com/7.0/pusher.min.js"></script>
    <title>Reservas</title>
</head>
<body>
    <div class="container">
        <h1>Reservas</h1>
        <form id="formReservas">
            <input type="hidden" id="reservaId" name="reservaId">
            <div class="mb-3">
                <label for="txtNombreApellido" class="form-label">Nombre y Apellido</label>
                <input type="text" class="form-control" id="txtNombreApellido" name="txtNombreApellido" required>
            </div>
            <div class="mb-3">
                <label for="txtTelefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="txtTelefono" name="txtTelefono" required>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                <button type="button" class="btn btn-danger" id="btnEliminar" disabled>Eliminar</button>
            </div>
        </form>
        <h2>Lista de Reservas</h2>
        <table class="table table-sm">
            <thead>
                <tr>
                    <th>Nombre y Apellido</th>
                    <th>Teléfono</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbodyReservas"></tbody>
        </table>
    </div>
    <script>
        $(document).ready(function() {
            // Function to fetch reservations
            function buscarReservas() {
                $.get("/reservas/buscar", function(respuesta) {
                    $("#tbodyReservas").html("");
                    respuesta.forEach(function(reserva) {
                        $("#tbodyReservas").append(`<tr>
                            <td><span class="math-inline">\{reserva\[1\]\}</td\>
<td\></span>{reserva[2]}</td>
                            <td><span class="math-inline">\{reserva\[3\]\}</td\>
<td\>
<button class\="btn btn\-sm btn\-info" data\-reserva\-id\="</span>{reserva[0]}">Editar</button>
                                <button class="btn btn-sm btn-danger" data-reserva-id="${reserva[0]}">Eliminar</button>
                            </td>
                        </tr>`);
                    });
                });
            }
            
            // Submitting the form (create or update)
            <span class="math-inline">\("\#formReservas"\)\.submit\(function\(event\) \{
event\.preventDefault\(\);
let url \= "/reservas/guardar";
let method \= "POST";
if \(</span>("#reservaId").val()) {
                    url = "/reservas/editar";
                    method = "PUT";
                }
                
                $.ajax({
                    url: url,
                    method: method,
                    data: $(this).serialize(),
                    success: function(respuesta) {
                        alert(respuesta);
                        buscarReservas();
                        $("#formReservas")[0].reset(); // Clear form after submit
                        $("#reservaId").val(""); // Clear hidden field after submit
                        $("#btnGuardar").text("Guardar"); // Reset button text
                        $("#btnEliminar").prop("disabled", true); // Disable delete button
                    }
                });
            });
            
            // Edit button click
            $(document).on("click", ".btn-info", function() {
                let reservaId = $(this).data("reservaId");
                $.get("/reservas/" + reservaId, function(reserva) {
                    $("#txtNombreApellido").val(reserva.nombre_apellido);
                    $("#txtTelefono").val(reserva.telefono);
                    $("#reservaId").val(reservaId);
                    $("#btnGuardar").text("Actualizar");
                    $("#btnEliminar").prop("disabled", false); //
